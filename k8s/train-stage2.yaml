# Suspended Stage 2 OOF-only workload using the completed porsche B12 fold set.
apiVersion: batch/v1
kind: Job
metadata:
  name: kcorrdiff-stage2-oof-rsync-v1
  namespace: ws-md93se6gk3270
  labels:
    app.kubernetes.io/name: kcorrdiff
    app.kubernetes.io/component: stage2-regression-training
    app.kubernetes.io/instance: fullwidth-oof-rsync-v1
spec:
  # Drafts are inert even if accidentally applied. Remove this only after the
  # CLI/config/data preconditions in README.md have been verified.
  suspend: true
  completions: 1
  parallelism: 1
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kcorrdiff
        app.kubernetes.io/component: stage2-regression-training
        app.kubernetes.io/instance: fullwidth-oof-rsync-v1
    spec:
      serviceAccountName: kcorrdiff-porsche-trainer
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 300
      nodeSelector:
        kubernetes.io/hostname: porsche
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        runAsNonRoot: false
        fsGroup: 1035
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trainer
          image: pytorch/pytorch:2.13.0-cuda12.6-cudnn9-runtime
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/code/kcorrdiff-rsync-oof-subbatch8-fastjoin-v11
          command: ["/bin/bash", "-ceu"]
          args:
            - |
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y --no-install-recommends openssh-client rsync
              rm -rf /var/lib/apt/lists/*
              umask 0007

              # New code lives in a separate snapshot; the active v3 producer
              # snapshot remains untouched and is consumed read-only below.
              source_root=/workspace/code/kcorrdiff-rsync-oof-subbatch8-fastjoin-v11
              config_path=${source_root}/configs/stage2-full-width.yaml
              radar_cache_root=/workspace/data/cache/radar-v1
              era5_cache_root=/workspace/data/cache/era5-v1
              draw_manifest=/workspace/data/manifests/event-pretrain-production-v1/training-draw-manifest.jsonl
              candidate_manifest=/workspace/data/manifests/event-pretrain-production-v1/candidate-manifest.json
              bundle_metadata=/workspace/data/manifests/event-pretrain-production-v1/bundle-metadata.json
              data_contract=${source_root}/configs/data-contract-v1.1.3b.json
              static_path=/workspace/data/static/target_static.npz
              run_root=/workspace/runs/stage2/${RUN_ID}
              oof_output_dir=${run_root}/oof
              log_file=${run_root}/train.log
              provenance_dir=${run_root}/provenance
              runtime_report=/workspace/envs/stage2-python-v1/pip-report.json
              oof_remote_ssh_config=/workspace/.ssh/config
              fold_set_root=/workspace/runs/stage2-folds-porsche-v3/assembled/fold-set-v1
              fold_set_manifest=${fold_set_root}/fold-set-manifest.json

              install -d -o 0 -g 1035 -m 2770 \
                "${run_root}/checkpoints" "${oof_output_dir}" \
                "${run_root}/logs" "${run_root}/wandb" "${provenance_dir}"
              exec > >(tee -a "${log_file}") 2>&1

              test -f "${source_root}/pyproject.toml"
              test -f "${source_root}/kcorrdiff/training/train_stage2.py"
              test -f "${config_path}"
              test -f "${radar_cache_root}/manifest.json"
              test -f "${era5_cache_root}/manifest.json"
              test -f "${draw_manifest}"
              test -f "${candidate_manifest}"
              test -f "${bundle_metadata}"
              test -f "${data_contract}"
              test -f "${static_path}"
              test -r "${oof_remote_ssh_config}"
              test -f "${fold_set_manifest}"
              python -c 'import numpy, scipy, torch, yaml, wandb'
              nvidia-smi -L
              gpu_count="$(python -c 'import torch; print(torch.cuda.device_count())')"
              (( gpu_count > 0 ))

              export WANDB_DIR="${run_root}/wandb"
              export WANDB_NAME="${RUN_ID}"
              export WANDB_RUN_ID="${RUN_ID}"
              export WANDB_BACKEND_RUN_ID="${POD_NAME}"
              export WANDB_RESUME=allow

              exec torchrun \
                --standalone \
                --nnodes=1 \
                --nproc-per-node="${gpu_count}" \
                -m kcorrdiff.training.train_stage2 \
                --source-root "${source_root}" \
                --config "${config_path}" \
                --runtime-report "${runtime_report}" \
                --radar-cache-root "${radar_cache_root}" \
                --era5-cache-root "${era5_cache_root}" \
                --draw-manifest "${draw_manifest}" \
                --candidate-manifest "${candidate_manifest}" \
                --bundle-metadata "${bundle_metadata}" \
                --data-contract "${data_contract}" \
                --static-path "${static_path}" \
                --output-dir "${run_root}" \
                --oof-output-dir "${oof_output_dir}" \
                --fold-set-manifest "${fold_set_manifest}" \
                --oof-remote-ssh-config "${oof_remote_ssh_config}" \
                --phases oof \
                --roles fold:0,fold:1,fold:2 \
                --precision float32 \
                --disable-tf32 \
                --target-widths 64,128,256,384,512 \
                --context-widths 32,64,128,256,384 \
                --era-latent-channels 128 \
                --era-grid-size 33 \
                --per-rank-microbatch-size 64 \
                --gradient-accumulation-steps 1 \
                --num-workers 32 \
                --prefetch-factor 2 \
                --fail-on-fallback \
                --wandb-mode online \
                --run-id "${RUN_ID}" \
                --wandb-backend-run-id "${WANDB_BACKEND_RUN_ID}" \
                --storage-reserve-gib 10
          env:
            - name: RUN_ID
              value: stage2-fullwidth-oof-rsync-v1
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PYTHONPATH
              value: /workspace/envs/stage2-python-v1:/workspace/code/kcorrdiff-rsync-oof-subbatch8-fastjoin-v11
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONPYCACHEPREFIX
              value: /tmp/pycache
            - name: TMPDIR
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/cache
            - name: TORCH_EXTENSIONS_DIR
              value: /tmp/torch-extensions
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /tmp/torchinductor
            - name: TRITON_CACHE_DIR
              value: /tmp/triton
            - name: OMP_NUM_THREADS
              value: "8"
            - name: TORCH_NCCL_ASYNC_ERROR_HANDLING
              value: "1"
            - name: NCCL_DEBUG
              value: WARN
            - name: NVIDIA_TF32_OVERRIDE
              value: "0"
            - name: CUBLAS_WORKSPACE_CONFIG
              value: ":4096:8"
            - name: PYTHONHASHSEED
              value: "11103"
            - name: KCORRDIFF_REQUIRE_FULL_WIDTH
              value: "1"
            - name: KCORRDIFF_REQUIRE_PRECISION
              value: float32
            - name: KCORRDIFF_REQUIRE_ERA_GRID_SIZE
              value: "33"
            - name: KCORRDIFF_ALLOW_CPU_FALLBACK
              value: "0"
            - name: KCORRDIFF_ALLOW_MODEL_WIDTH_FALLBACK
              value: "0"
            - name: KCORRDIFF_ALLOW_PRECISION_FALLBACK
              value: "0"
            - name: KCORRDIFF_ALLOW_ERA_GRID_FALLBACK
              value: "0"
            - name: WANDB_PROJECT
              value: kcorrdiff
            - name: WANDB_JOB_TYPE
              value: stage2-regression-fullwidth
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wandb-api
                  key: WANDB_API_KEY
          resources:
            requests:
              cpu: "0"
              memory: "0"
              ephemeral-storage: "0"
              nvidia.com/gpu: 1
            limits:
              cpu: "32"
              memory: 124Gi
              ephemeral-storage: 8Gi
              nvidia.com/gpu: 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: dshm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: saycorn-volume
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 64Gi
        - name: tmp
          emptyDir:
            sizeLimit: 8Gi
