# Future Stage 2 full-width regression/OOF training workload. See README.md for
# the expected (not yet implemented) module and config contract.
apiVersion: batch/v1
kind: Job
metadata:
  name: kcorrdiff-train-stage2-fullwidth
  namespace: ws-md93se6gk3270
  labels:
    app.kubernetes.io/name: kcorrdiff
    app.kubernetes.io/component: stage2-regression-training
    app.kubernetes.io/instance: fullwidth-v1-1-3b
spec:
  # Drafts are inert even if accidentally applied. Remove this only after the
  # CLI/config/data preconditions in README.md have been verified.
  suspend: true
  completions: 1
  parallelism: 1
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kcorrdiff
        app.kubernetes.io/component: stage2-regression-training
        app.kubernetes.io/instance: fullwidth-v1-1-3b
    spec:
      serviceAccountName: kcorrdiff-porsche-trainer
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 300
      nodeSelector:
        kubernetes.io/hostname: porsche
      securityContext:
        runAsUser: 1035
        runAsGroup: 1035
        runAsNonRoot: true
        fsGroup: 1035
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trainer
          image: pytorch/pytorch:2.13.0-cuda12.6-cudnn9-runtime@sha256:6acf597eeb8e376a96580dde4952f37cc017fef732bb40bfc73f28f25e3f64b4
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/KCorrDiff
          command: ["/bin/bash", "-ceu"]
          args:
            - |
              source_root=/workspace/KCorrDiff
              config_path=${source_root}/configs/stage2-full-width.yaml
              radar_cache_root=/workspace/data/cache/radar-v1
              era5_cache_root=/workspace/data/cache/era5-v1
              draw_manifest=/workspace/data/manifests/event-pretrain-initial-v1/training-draw-manifest.jsonl
              static_path=/workspace/data/static/target_static.npz
              run_root=/workspace/runs/stage2/${RUN_ID}
              checkpoint_dir=${run_root}/checkpoints
              oof_output_dir=${run_root}/oof
              log_file=${run_root}/train.log

              install -d -m 0770 \
                "${checkpoint_dir}" "${oof_output_dir}" \
                "${run_root}/logs" "${run_root}/wandb"
              exec > >(tee -a "${log_file}") 2>&1

              test -f "${source_root}/pyproject.toml"
              test -f "${source_root}/kcorrdiff/training/train_stage2.py"
              test -f "${config_path}"
              test -f "${radar_cache_root}/manifest.json"
              test -f "${era5_cache_root}/manifest.json"
              test -f "${draw_manifest}"
              test -f "${static_path}"
              python -c 'import numpy, scipy, torch, yaml, wandb'
              nvidia-smi -L
              python -c 'import torch; count = torch.cuda.device_count(); assert count == 2, f"expected exactly two visible training GPUs, got {count}"'

              export WANDB_DIR="${run_root}/wandb"
              export WANDB_NAME="${RUN_ID}"
              export WANDB_RUN_ID="${RUN_ID}"
              export WANDB_RESUME=never

              exec torchrun \
                --standalone \
                --nnodes=1 \
                --nproc-per-node=2 \
                -m kcorrdiff.training.train_stage2 \
                --config "${config_path}" \
                --radar-cache-root "${radar_cache_root}" \
                --era5-cache-root "${era5_cache_root}" \
                --draw-manifest "${draw_manifest}" \
                --static-path "${static_path}" \
                --output-dir "${checkpoint_dir}" \
                --oof-output-dir "${oof_output_dir}" \
                --require-world-size 2 \
                --precision float32 \
                --disable-tf32 \
                --target-widths 64,128,256,384,512 \
                --context-widths 32,64,128,256,384 \
                --era-latent-channels 128 \
                --era-grid-size 33 \
                --per-rank-microbatch-size 1 \
                --gradient-accumulation-steps 4 \
                --num-workers 12 \
                --prefetch-factor 4 \
                --fail-on-fallback
          env:
            - name: RUN_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PYTHONPATH
              value: /workspace/KCorrDiff
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONPYCACHEPREFIX
              value: /tmp/pycache
            - name: TMPDIR
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/cache
            - name: TORCH_EXTENSIONS_DIR
              value: /tmp/torch-extensions
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /tmp/torchinductor
            - name: TRITON_CACHE_DIR
              value: /tmp/triton
            - name: OMP_NUM_THREADS
              value: "8"
            - name: TORCH_NCCL_ASYNC_ERROR_HANDLING
              value: "1"
            - name: NCCL_DEBUG
              value: WARN
            - name: NVIDIA_TF32_OVERRIDE
              value: "0"
            - name: CUBLAS_WORKSPACE_CONFIG
              value: ":4096:8"
            - name: PYTHONHASHSEED
              value: "11103"
            - name: KCORRDIFF_REQUIRE_FULL_WIDTH
              value: "1"
            - name: KCORRDIFF_REQUIRE_PRECISION
              value: float32
            - name: KCORRDIFF_REQUIRE_ERA_GRID_SIZE
              value: "33"
            - name: KCORRDIFF_ALLOW_CPU_FALLBACK
              value: "0"
            - name: KCORRDIFF_ALLOW_MODEL_WIDTH_FALLBACK
              value: "0"
            - name: KCORRDIFF_ALLOW_PRECISION_FALLBACK
              value: "0"
            - name: KCORRDIFF_ALLOW_ERA_GRID_FALLBACK
              value: "0"
            - name: WANDB_PROJECT
              value: kcorrdiff
            - name: WANDB_JOB_TYPE
              value: stage2-regression-fullwidth
            - name: WANDB_API_KEY
              valueFrom:
                secretKeyRef:
                  name: wandb-api
                  key: WANDB_API_KEY
          resources:
            requests:
              cpu: "0"
              memory: "0"
              ephemeral-storage: "0"
              nvidia.com/gpu: 2
            limits:
              cpu: "32"
              memory: 128Gi
              ephemeral-storage: 8Gi
              nvidia.com/gpu: 2
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: dshm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: saycorn-volume
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: tmp
          emptyDir:
            sizeLimit: 8Gi
