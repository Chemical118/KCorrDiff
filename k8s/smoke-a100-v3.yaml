# One-shot A100 validation for the fixed Stage 2/3 model semantics.
apiVersion: batch/v1
kind: Job
metadata:
  name: kcorrdiff-a100-smoke-v3-20260815-r2
  namespace: ws-md93se6gk3270
  labels:
    app.kubernetes.io/name: kcorrdiff
    app.kubernetes.io/component: a100-smoke
    app.kubernetes.io/instance: fixed-model-v3
spec:
  completions: 1
  parallelism: 1
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kcorrdiff
        app.kubernetes.io/component: a100-smoke
        app.kubernetes.io/instance: fixed-model-v3
    spec:
      serviceAccountName: kcorrdiff-porsche-trainer
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: Never
      terminationGracePeriodSeconds: 60
      nodeSelector:
        kubernetes.io/hostname: porsche
      securityContext:
        runAsUser: 1035
        runAsGroup: 1035
        runAsNonRoot: true
        fsGroup: 1035
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: smoke
          image: pytorch/pytorch:2.13.0-cuda12.6-cudnn9-runtime@sha256:6acf597eeb8e376a96580dde4952f37cc017fef732bb40bfc73f28f25e3f64b4
          imagePullPolicy: IfNotPresent
          workingDir: /workspace/code/stage2-folds-porsche-v3
          command: ["/bin/bash", "-ceu"]
          args:
            - |
              source_root=/workspace/code/stage2-folds-porsche-v3
              smoke_source=/workspace/smoke/kcorrdiff-a100-v3
              bundle_root=/workspace/data/manifests/event-pretrain-production-v1
              run_root=/workspace/runs/smoke/a100-v3-20260815-r2
              output_json=${run_root}/stage2-production-step.json

              test ! -e "${run_root}"
              install -d -m 0770 "${run_root}"
              exec > >(tee -a "${run_root}/smoke.log") 2>&1

              test -f "${source_root}/kcorrdiff/training/model_benchmark.py"
              test -f "${smoke_source}/scripts/smoke_a100.py"
              test -f "${bundle_root}/candidate-manifest.json"
              test -f "${bundle_root}/training-draw-manifest.jsonl"
              test -f "${bundle_root}/bundle-metadata.json"
              python -c 'import numpy, scipy, torch, yaml'
              python -m pip install \
                --disable-pip-version-check \
                --no-cache-dir \
                --target /tmp/smoke-test-deps \
                pytest==8.4.2
              export PYTHONPATH="/tmp/smoke-test-deps:${PYTHONPATH}"
              python -c 'import pytest; assert pytest.__version__ == "8.4.2"'
              nvidia-smi -L
              python -c 'import torch; assert torch.cuda.device_count() == 1; assert "A100" in torch.cuda.get_device_name(0)'

              python -m pytest -q \
                "${smoke_source}/tests/data/test_advection.py::test_gradient_path_and_conditional_cuda_parity" \
                "${smoke_source}/tests/data/test_advection.py::test_flow_estimator_cpu_cuda_common_kernel_parity" \
                "${smoke_source}/tests/models/test_advection.py::test_adapter_cuda_shape_and_gradient" \
                "${smoke_source}/tests/models/test_era_encoder.py::test_cpu_cuda_parity" \
                "${smoke_source}/tests/models/test_physical_attention.py::test_cpu_cuda_parity" \
                "${smoke_source}/tests/models/test_regression_system.py::test_training_batch_to_cuda_and_full_forward_device_contract" \
                "${smoke_source}/tests/training/test_batch.py::test_pin_memory_retains_context_channel_views"

              python -m kcorrdiff.training.model_benchmark \
                --config "${source_root}/configs/stage2-full-width.yaml" \
                --radar-cache-root /workspace/data/cache/radar-v1 \
                --era5-cache-root /workspace/data/cache/era5-v1 \
                --target-static /workspace/data/static/target_static.npz \
                --candidate-manifest "${bundle_root}/candidate-manifest.json" \
                --candidate-manifest-sha256 4f321077767f47591e0686f2913938c94e53786ebaf525626e794da4c01c0566 \
                --draw-manifest "${bundle_root}/training-draw-manifest.jsonl" \
                --draw-manifest-sha256 83907188044ed3f5f0964090f4b7b4de5fd666791d7aed85db31a435bffc603c \
                --bundle-metadata "${bundle_root}/bundle-metadata.json" \
                --bundle-metadata-sha256 c09ed583d401adba90c38547ca3beda573fc53f517da0c7a92676b64f6e7b2de \
                --target-coordinates-sha256 76ab36d56fbc6f9a626164ffe818ef5dc553b2a897a0185efb7617878a59a912 \
                --context-coordinates-sha256 7ea1d02c8136a8cf59713b5d07ccd40806ee38ca660a8c19ccfb6a6ab3693065 \
                --output-json "${output_json}" \
                --device cuda:0 \
                --precision float32 \
                --disable-tf32 \
                --fail-on-fallback \
                --pin-memory \
                --batch-sizes 1 \
                --warmup-steps 1 \
                --measured-steps 1 \
                --worker-count 0 \
                --prefetch-factor 2 \
                --maximum-grid-cells 1 \
                --maximum-host-pipeline-bytes 85899345920 \
                --maximum-shm-pipeline-bytes 30064771072 \
                --payload-safety-factor 1.25 \
                --logical-world-size 2 \
                --rank 0 \
                --role deployment \
                --wandb-mode disabled

              python "${smoke_source}/scripts/smoke_a100.py"
              touch "${run_root}/SMOKE_PASSED"
          env:
            - name: PYTHONPATH
              value: /workspace/envs/stage2-python-v1:/workspace/code/stage2-folds-porsche-v3
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: PYTHONPYCACHEPREFIX
              value: /tmp/pycache
            - name: TMPDIR
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/cache
            - name: TORCH_EXTENSIONS_DIR
              value: /tmp/torch-extensions
            - name: TORCHINDUCTOR_CACHE_DIR
              value: /tmp/torchinductor
            - name: TRITON_CACHE_DIR
              value: /tmp/triton
            - name: OMP_NUM_THREADS
              value: "8"
            - name: NVIDIA_TF32_OVERRIDE
              value: "0"
            - name: KCORRDIFF_REQUIRE_FULL_WIDTH
              value: "1"
            - name: KCORRDIFF_REQUIRE_PRECISION
              value: float32
            - name: KCORRDIFF_REQUIRE_ERA_GRID_SIZE
              value: "33"
            - name: KCORRDIFF_ALLOW_CPU_FALLBACK
              value: "0"
            - name: KCORRDIFF_ALLOW_MODEL_WIDTH_FALLBACK
              value: "0"
            - name: KCORRDIFF_ALLOW_PRECISION_FALLBACK
              value: "0"
            - name: KCORRDIFF_ALLOW_ERA_GRID_FALLBACK
              value: "0"
          resources:
            requests:
              cpu: "0"
              memory: "0"
              ephemeral-storage: "0"
              nvidia.com/gpu: 1
            limits:
              cpu: "32"
              memory: 96Gi
              ephemeral-storage: 10Gi
              nvidia.com/gpu: 1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: workspace
              mountPath: /workspace
            - name: dshm
              mountPath: /dev/shm
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: workspace
          persistentVolumeClaim:
            claimName: saycorn-volume
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 32Gi
        - name: tmp
          emptyDir:
            sizeLimit: 10Gi
