apiVersion: v1
kind: Pod
metadata:
  name: porsche
  namespace: ws-md93se6gk3270
  labels:
    app.kubernetes.io/name: kcorrdiff
    app.kubernetes.io/component: gpu-debug-shell
spec:
  serviceAccountName: kcorrdiff-porsche-trainer
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  terminationGracePeriodSeconds: 30
  nodeSelector:
    kubernetes.io/hostname: porsche
  securityContext:
    runAsUser: 1035
    runAsGroup: 1035
    runAsNonRoot: true
    fsGroup: 1035
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: shell
      image: pytorch/pytorch:2.13.0-cuda12.6-cudnn9-runtime@sha256:6acf597eeb8e376a96580dde4952f37cc017fef732bb40bfc73f28f25e3f64b4
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-lc", "exec sleep infinity"]
      resources:
        requests:
          cpu: "0"
          memory: "0"
          ephemeral-storage: "0"
          nvidia.com/gpu: 2
        limits:
          cpu: "32"
          memory: 96Gi
          ephemeral-storage: 10Gi
          nvidia.com/gpu: 2
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: dshm
          mountPath: /dev/shm
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: saycorn-volume
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 32Gi
