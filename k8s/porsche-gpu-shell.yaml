# Goal-lifetime GPU shells.  Two independent one-GPU Pods let the first Pod
# start when only one porsche GPU is free while the second remains queued.  Both
# mount the porsche-local RWO PVC and are kept until the goal is complete.
apiVersion: v1
kind: Pod
metadata:
  name: porsche-gpu-0
  namespace: ws-md93se6gk3270
  labels:
    app.kubernetes.io/name: kcorrdiff
    app.kubernetes.io/component: gpu-goal-shell
    kcorrdiff.snu.ac.kr/gpu-slot: "0"
spec:
  serviceAccountName: kcorrdiff-porsche-trainer
  restartPolicy: Never
  automountServiceAccountToken: false
  enableServiceLinks: false
  terminationGracePeriodSeconds: 30
  nodeSelector:
    kubernetes.io/hostname: porsche
  securityContext:
    runAsUser: 1035
    runAsGroup: 1035
    runAsNonRoot: true
    fsGroup: 1035
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: shell
      image: sgs-registry.snucse.org/ws-md93se6gk3270/kcorrdiff-runtime:pytorch-2.13-transfer-v1
      imagePullPolicy: IfNotPresent
      workingDir: /workspace/KCorrDiff
      command: ["/bin/bash", "-lc", "exec sleep infinity"]
      env:
        - name: PYTHONPATH
          value: /workspace/envs/stage2-python-v1:/workspace/KCorrDiff
        - name: PYTHONUNBUFFERED
          value: "1"
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: PYTHONPYCACHEPREFIX
          value: /tmp/pycache
        - name: TMPDIR
          value: /tmp
        - name: XDG_CACHE_HOME
          value: /tmp/cache
        - name: TORCH_EXTENSIONS_DIR
          value: /tmp/torch-extensions
        - name: TORCHINDUCTOR_CACHE_DIR
          value: /tmp/torchinductor
        - name: TRITON_CACHE_DIR
          value: /tmp/triton
        - name: NVIDIA_TF32_OVERRIDE
          value: "0"
        - name: WANDB_PROJECT
          value: kcorrdiff
        - name: WANDB_MODE
          value: online
        - name: WANDB_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandb-api
              key: WANDB_API_KEY
      resources:
        requests:
          cpu: "0"
          memory: "0"
          ephemeral-storage: "0"
          nvidia.com/gpu: 1
        limits:
          cpu: "16"
          memory: 52Gi
          ephemeral-storage: 10Gi
          nvidia.com/gpu: 1
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: dshm
          mountPath: /dev/shm
        - name: tmp
          mountPath: /tmp
  volumes:
    - name: workspace
      persistentVolumeClaim:
        claimName: saycorn-volume
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: 16Gi
    - name: tmp
      emptyDir:
        sizeLimit: 10Gi
---
