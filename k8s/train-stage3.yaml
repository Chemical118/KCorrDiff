# Stage 3 is deliberately split at the two independent-evaluation boundaries.
# All resources remain suspended until their phase-specific prerequisites have
# been reviewed.  The three Jobs share one immutable run root and W&B identity
# so the finalists phase can validate/reuse the seed-11103 screening weights.
apiVersion: v1
kind: List
metadata:
  name: kcorrdiff-stage3-fullwidth-v1-1-3b-v2
items:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: kcorrdiff-stage3-runner-v1-1-3b-v2
      namespace: ws-md93se6gk3270
      labels:
        app.kubernetes.io/name: kcorrdiff
        app.kubernetes.io/component: stage3-diffusion-training
        app.kubernetes.io/instance: fullwidth-v1-1-3b
    immutable: true
    data:
      stage3-entrypoint.sh: |
        #!/bin/bash
        set -euo pipefail
        umask 0007

        source_root=/workspace/code/kcorrdiff-rsync-oof-eager-v3
        stage3_config=${source_root}/configs/stage3-full-width.yaml
        stage2_release=/workspace/releases/stage2/selected
        stage2_release_index=${stage2_release}/release-index.json
        oof_remote_ssh_config=/workspace/.ssh/config
        oof_remote_cache=/tmp/oof-remote-cache

        run_root=/workspace/runs/stage3/${STAGE3_RUN_ID}
        provenance_dir=${run_root}/provenance
        runtime_report=${provenance_dir}/runtime-report.json
        screening_evaluation=/workspace/releases/stage3/evaluations/screening-evaluation.json
        final_decision=/workspace/releases/stage3/model-selection-decision.json
        log_file=${run_root}/logs/${STAGE3_PHASE}.log

        case "${STAGE3_PHASE}" in
          screen|finalists|bind-decision) ;;
          *) echo "unsupported immutable Stage 3 phase: ${STAGE3_PHASE}" >&2; exit 64 ;;
        esac

        install -d -m 0770 \
          "${run_root}/checkpoints" "${run_root}/logs" \
          "${run_root}/wandb" "${provenance_dir}"
        exec > >(tee -a "${log_file}") 2>&1

        test -f "${source_root}/pyproject.toml"
        test -f "${source_root}/kcorrdiff/training/train_stage3.py"
        test -f "${source_root}/kcorrdiff/training/stage3_data.py"
        test -f "${stage3_config}"
        test -f "${stage2_release_index}"
        test -r "${oof_remote_ssh_config}"
        install -d -m 0700 "${oof_remote_cache}"

        case "${STAGE3_PHASE}" in
          screen)
            phase_arguments=(--phase screen)
            ;;
          finalists)
            test -f "${run_root}/screening-training-manifest.json"
            test -f "${screening_evaluation}"
            phase_arguments=(
              --phase finalists
              --screening-evaluation "${screening_evaluation}"
            )
            ;;
          bind-decision)
            test -f "${run_root}/finalist-training-manifest.json"
            test -f "${final_decision}"
            phase_arguments=(
              --phase bind-decision
              --final-decision "${final_decision}"
            )
            ;;
        esac

        python -c 'import numpy, scipy, torch, yaml, wandb'
        nvidia-smi -L
        gpu_count="$(python -c 'import torch; print(torch.cuda.device_count())')"
        (( gpu_count > 0 ))

        python - "${runtime_report}" <<'PY'
        from pathlib import Path
        import sys

        import torch

        torch.backends.cuda.matmul.allow_tf32 = False
        torch.backends.cudnn.allow_tf32 = False
        from kcorrdiff.training.train_stage3 import write_runtime_report

        print(write_runtime_report(Path(sys.argv[1])))
        PY

        export WANDB_DIR="${run_root}/wandb"
        export WANDB_NAME="${STAGE3_RUN_ID}"
        export WANDB_RUN_ID="${STAGE3_RUN_ID}"

        exec torchrun \
          --standalone \
          --nnodes=1 \
          --nproc-per-node="${gpu_count}" \
          -m kcorrdiff.training.train_stage3 \
          "${phase_arguments[@]}" \
          --config "${stage3_config}" \
          --stage2-release-index "${stage2_release_index}" \
          --stage2-release-root "${stage2_release}" \
          --oof-remote-ssh-config "${oof_remote_ssh_config}" \
          --oof-remote-cache-root "${oof_remote_cache}" \
          --output-dir "${run_root}" \
          --precision float32 \
          --disable-tf32 \
          --target-widths 64,128,256,384,512 \
          --context-widths 32,64,128,256,384 \
          --era-latent-channels 128 \
          --era-grid-size 33 \
          --per-rank-microbatch-size 1 \
          --gradient-accumulation-steps 4 \
          --num-workers 12 \
          --prefetch-factor 4 \
          --fail-on-fallback \
          --wandb-mode online \
          --run-id "${STAGE3_RUN_ID}"

  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: kcorrdiff-stage3-screen-fullwidth
      namespace: ws-md93se6gk3270
      labels:
        app.kubernetes.io/name: kcorrdiff
        app.kubernetes.io/component: stage3-diffusion-training
        app.kubernetes.io/instance: fullwidth-v1-1-3b
        kcorrdiff.ai/stage3-phase: screen
    spec:
      suspend: true
      completions: 1
      parallelism: 1
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kcorrdiff
            app.kubernetes.io/component: stage3-diffusion-training
            app.kubernetes.io/instance: fullwidth-v1-1-3b
            kcorrdiff.ai/stage3-phase: screen
        spec: &stage3_pod_spec
          serviceAccountName: kcorrdiff-porsche-trainer
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: Never
          terminationGracePeriodSeconds: 300
          nodeSelector:
            kubernetes.io/hostname: porsche
          securityContext:
            runAsUser: 1035
            runAsGroup: 1035
            runAsNonRoot: true
            fsGroup: 1035
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: trainer
              image: &stage3_image sgs-registry.snucse.org/ws-md93se6gk3270/kcorrdiff-runtime:pytorch-2.13-transfer-v1
              imagePullPolicy: IfNotPresent
              workingDir: /workspace/code/kcorrdiff-rsync-oof-eager-v3
              command: ["/bin/bash", "/opt/kcorrdiff/stage3-entrypoint.sh"]
              env:
                - name: STAGE3_PHASE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.labels['kcorrdiff.ai/stage3-phase']
                - name: STAGE3_RUN_ID
                  value: stage3-fullwidth-v1-1-3b
                - name: KCORRDIFF_CONTAINER_IMAGE
                  value: *stage3_image
                - name: PYTHONPATH
                  value: /workspace/envs/stage2-python-v1:/workspace/code/kcorrdiff-rsync-oof-eager-v3
                - name: PYTHONUNBUFFERED
                  value: "1"
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: PYTHONPYCACHEPREFIX
                  value: /tmp/pycache
                - name: TMPDIR
                  value: /tmp
                - name: XDG_CACHE_HOME
                  value: /tmp/cache
                - name: TORCH_EXTENSIONS_DIR
                  value: /tmp/torch-extensions
                - name: TORCHINDUCTOR_CACHE_DIR
                  value: /tmp/torchinductor
                - name: TRITON_CACHE_DIR
                  value: /tmp/triton
                - name: OMP_NUM_THREADS
                  value: "8"
                - name: TORCH_NCCL_ASYNC_ERROR_HANDLING
                  value: "1"
                - name: NCCL_DEBUG
                  value: WARN
                - name: NVIDIA_TF32_OVERRIDE
                  value: "0"
                - name: CUBLAS_WORKSPACE_CONFIG
                  value: ":4096:8"
                - name: PYTHONHASHSEED
                  value: "11103"
                - name: KCORRDIFF_REQUIRE_FULL_WIDTH
                  value: "1"
                - name: KCORRDIFF_REQUIRE_PRECISION
                  value: float32
                - name: KCORRDIFF_REQUIRE_ERA_GRID_SIZE
                  value: "33"
                - name: KCORRDIFF_ALLOW_CPU_FALLBACK
                  value: "0"
                - name: KCORRDIFF_ALLOW_MODEL_WIDTH_FALLBACK
                  value: "0"
                - name: KCORRDIFF_ALLOW_PRECISION_FALLBACK
                  value: "0"
                - name: KCORRDIFF_ALLOW_ERA_GRID_FALLBACK
                  value: "0"
                - name: WANDB_PROJECT
                  value: kcorrdiff
                - name: WANDB_JOB_TYPE
                  value: stage3-residual-edm-fullwidth
                - name: WANDB_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: wandb-api
                      key: WANDB_API_KEY
              resources:
                requests:
                  cpu: "0"
                  memory: "0"
                  ephemeral-storage: "0"
                  nvidia.com/gpu: 1
                limits:
                  cpu: "32"
                  memory: 124Gi
                  ephemeral-storage: 8Gi
                  nvidia.com/gpu: 1
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                readOnlyRootFilesystem: true
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: workspace
                  mountPath: /workspace
                - name: dshm
                  mountPath: /dev/shm
                - name: tmp
                  mountPath: /tmp
                - name: stage3-runner
                  mountPath: /opt/kcorrdiff
                  readOnly: true
          volumes:
            - name: workspace
              persistentVolumeClaim:
                claimName: saycorn-volume
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 32Gi
            - name: tmp
              emptyDir:
                sizeLimit: 8Gi
            - name: stage3-runner
              configMap:
                name: kcorrdiff-stage3-runner-v1-1-3b-v2
                defaultMode: 0555

  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: kcorrdiff-stage3-finalists-fullwidth
      namespace: ws-md93se6gk3270
      labels:
        app.kubernetes.io/name: kcorrdiff
        app.kubernetes.io/component: stage3-diffusion-training
        app.kubernetes.io/instance: fullwidth-v1-1-3b
        kcorrdiff.ai/stage3-phase: finalists
    spec:
      suspend: true
      completions: 1
      parallelism: 1
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kcorrdiff
            app.kubernetes.io/component: stage3-diffusion-training
            app.kubernetes.io/instance: fullwidth-v1-1-3b
            kcorrdiff.ai/stage3-phase: finalists
        spec: *stage3_pod_spec

  - apiVersion: batch/v1
    kind: Job
    metadata:
      name: kcorrdiff-stage3-bind-decision
      namespace: ws-md93se6gk3270
      labels:
        app.kubernetes.io/name: kcorrdiff
        app.kubernetes.io/component: stage3-diffusion-training
        app.kubernetes.io/instance: fullwidth-v1-1-3b
        kcorrdiff.ai/stage3-phase: bind-decision
    spec:
      suspend: true
      completions: 1
      parallelism: 1
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kcorrdiff
            app.kubernetes.io/component: stage3-diffusion-training
            app.kubernetes.io/instance: fullwidth-v1-1-3b
            kcorrdiff.ai/stage3-phase: bind-decision
        spec: *stage3_pod_spec
