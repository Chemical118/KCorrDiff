[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kcorrdiff"
version = "0.1.0"
description = "Event-conditioned Korean precipitation CorrDiff with ERA5-oracle conditioning"
readme = "Note.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "torch>=2.5,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
data = [
  "cfgrib>=0.9.15,<1",
  "eccodes>=2.38,<3",
  "pyarrow>=16,<24",
  "xarray>=2024.1,<2027",
]
train = [
  "cfgrib>=0.9.15,<1",
  "eccodes>=2.38,<3",
  "pyarrow>=16,<24",
  "xarray>=2024.1,<2027",
  "wandb>=0.21,<1",
]
test = [
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
]

[project.scripts]
kcorrdiff-build-cache = "kcorrdiff.data.cache:main"
kcorrdiff-build-manifest = "kcorrdiff.data.split_manifest:main"
kcorrdiff-build-event-index = "kcorrdiff.data.event_manifest:event_index_main"
kcorrdiff-audit-manifest = "kcorrdiff.data.split_manifest:audit_main"
kcorrdiff-era5-cache = "kcorrdiff.data.era5_cache_cli:main"

[tool.setuptools.packages.find]
include = ["kcorrdiff*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
